name: docs

on:
  push:
    branches: [master, 'release-*']
  pull_request:
  workflow_dispatch:
  # Pick up README changes in the packages without anyone committing here.
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

env:
  SITE_URL: https://filagora.github.io/filagora-docs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
          extended: true
      - run: npm ci
      - name: Generate the package pages from the packages' READMEs
        run: SYNC_SOURCE=github bash scripts/sync-packages.sh
      - name: Build this ref
        run: bash scripts/hugo.sh --gc --minify --environment production
        env:
          HUGO_PARAMS_VERSION: ${{ github.ref_name == 'master' && 'dev' || github.ref_name }}
      - name: Assemble every version
        if: github.event_name != 'pull_request' && (github.ref_name == 'master' || startsWith(github.ref_name, 'release-'))
        run: bash scripts/build-all-versions.sh site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && (github.ref_name == 'master' || startsWith(github.ref_name, 'release-'))
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref_name == 'master' || startsWith(github.ref_name, 'release-'))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  leak-scan:
    uses: filagora/filagora-shared/.github/workflows/leak-scan.yml@master
    secrets: inherit
